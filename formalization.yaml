# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Provenance metadata for the Comparator wrapper around the formalization of
# Alpöge's disproof of the uniform-constant Erdős unit-distance conjecture.
#
# Follows the mathlib-initiative formalization.yaml v0.4 self-reporting format.
# The mathematical work lives in kim-em/erdos-unit-distance, which this
# repository exists only to expose through leanprover/comparator; its own
# formalization.yaml carries the per-lemma attribution and resource usage.

version: "v0.4"

project:
  name: erdos-unit-distance-comparator
  authors:
    - Kim Morrison
  responsible_maintainers:
    - Kim Morrison
  license: Apache-2.0
  short_description: >
    Comparator wrapper certifying that the ErdosUnitDistance library proves the
    literal negation of the uniform-constant form of Erdős's unit-distance
    conjecture, from a Mathlib-only statement of that negation.

repository:
  role: thin-wrapper
  substantive_formalization:
    id: kim-em/erdos-unit-distance
    revision: 34b4587bbd0740efb9c06a519a8ee14a3eff8cd7
    note: >
      The proof library. This repository adds only Challenge.lean, which states
      the theorem using Mathlib alone, and Solution.lean, which connects that
      statement to the library's theorem by definitional equality.

classification:
  arxiv: [math.CO, math.MG]
  msc2020: [52C10, 11R21]

result:
  name: erdos_unit_distance_uniform_constant_false
  statement: >
    For every C > 0 and every N there exist n ≥ N and an n-point set
    P ⊆ ℝ² whose number of unit-distance pairs exceeds
    n^(1 + C / log log n). This is the literal negation of the bound
    ν(n) ≤ n^(1 + C / log log n), for an absolute constant C, that Erdős
    conjectured to be optimal in 1994.
  compared_declaration: UnitDistance.erdos_unit_distance_uniform_constant_false
  axioms: [propext, Classical.choice, Quot.sound]
  sorries: 0
  scope_limitations: >
    Refutes only the uniform-constant form, and is strictly weaker than a
    fixed-power improvement ν(n) ≥ n^(1+δ). That stronger result (OpenAI 2026,
    via class field towers) now has an unconditional Lean formalization, so
    this work is neither the first nor the strongest here and does not claim to
    be. What it offers is the other trade: Alpöge's one-page argument reaches
    the weaker conclusion from elementary inputs, and the whole of it is
    formalized here with no classical result assumed as a hypothesis.
related_formalizations:
  - id: https://github.com/plby/Erdos90
    relationship: independent
    revision: 2062b0e6c9770c81e397bfe41148e90b92ca0567
    note: >
      Boris Alexeev's Lean formalization of OpenAI's 2026 counterexample,
      announced on the Lean Zulip and verified on lean-eval on 2026-06-26. He
      reports that Codex produced it over about a month with himself as the
      one person in the loop.

      It proves the fixed-power statement, and proves it outright: the class
      field theory is formalized rather than assumed, the proof path carries
      no sorries, and the repository's three axiom declarations, which state
      Remark II.3.12 of Milne's "Class Field Theory", are in a module the
      proof does not import.

      He reports 1.2 million lines in the formalization, of which roughly
      800,000 are imported by the final result and 10,000 to 40,000 are the
      novel part of the argument.
  - id: https://github.com/logical-intelligence/erdos-unit-distance
    relationship: independent
    revision: b6493074dd103ca32ea4f5e9b0bc9cb3a0379f2e
    note: >
      Logical Intelligence's Lean 4 formalization of the same result, produced
      with Aleph Prover, announced on 2026-05-28 at roughly 33,000 lines. It
      also reaches the fixed-power statement, that
      {n : 0 < n and nu(n) >= n^(1+delta)} is infinite for some delta > 0,
      by way of class field towers.

      It is conditional, deliberately and visibly: `main_theorem` takes the
      Golod-Shafarevich inequality and Shafarevich's relation-rank bound as
      hypotheses in its signature rather than formalizing them. Neither work
      uses the other.

sources:
  - title: Integral points on norm-one tori and the Erdős unit-distance exponent
    authors: [Levent Alpöge]
    year: 2026
    id: https://x.com/__alpoge__/status/2064409100562366543
    relationship: formalizes
    note: >
      A one-page proof posted on X, and the source formalized here. The only
      durable copy cited here is the transcription in informal-proof.md in the
      proof repository, which nobody but the submitter has checked against the
      original. The identically titled paper in the next entry is a different
      argument.
  - title: Integral points on norm-one tori and the Erdős unit-distance exponent
    year: 2026
    id: https://www-cdn.anthropic.com/files/4zrzovbb/website/ca35f196125c899a5ad11f011080202a652aef02.pdf
    relationship: background
    note: >
      A distinct 13-page paper carrying the identical title, recorded so the
      two are not confused. Not used here. It has no byline and no
      acknowledgements, so its authorship is unknown to the submitter; its PDF
      records a creation date of 2026-05-26.

      Its Theorem 1.1 gives ν(n) ≥ n^(1 + c₀ log log log n / log log n) along
      an infinite set of n, from which the result formalized here follows as a
      stated corollary. It draws its fields from an infinite unramified class
      field tower, by way of Golod-Shafarevich and three other classical
      inputs; the one-page argument uses multiquadratic CM fields and a
      pigeonhole on ideal classes, and needs no tower at all.

      Using class field towers, it is easily mistaken for the OpenAI result.
      It is not: its exponent is 1 + o(1), it says its construction does not
      threaten the Spencer-Szemeredi-Trotter ceiling, and Remark 8.1 leaves
      open whether more can be extracted. It sits strictly between the
      one-page argument and the fixed-power refutation.

      The submitter has read it for coherence only. Nothing here asserts it is
      correct, and no part of the formalization depends on it.
  - title: On sets of distances of n points
    authors: [Paul Erdős]
    year: 1946
    identifier: Amer. Math. Monthly 53 (1946), 248-250
    relationship: background
    note: >
      The problem, and the lower bound ν(n) ≥ n^(1 + c / log log n) that the
      conjecture refuted here asserts is optimal. Theorem 2. This paper is not
      where the matching upper bound is conjectured; see the next two entries.
  - title: Some problems in number theory, combinatorics and combinatorial geometry
    authors: [Paul Erdős]
    year: 1994
    identifier: Mathematica Pannonica 5 (1994), 261-269, p. 267
    relationship: background
    note: >
      Where Erdős conjectures that his 1946 lower bound is optimal. That is the
      uniform-constant statement whose negation is formalized here.
  - title: Some of my favourite problems which recently have been solved
    authors: [Paul Erdős]
    year: 1982
    identifier: Proceedings of the International Mathematical Conference, 59-79, p. 62
    relationship: background
    note: >
      An earlier and weaker form of the same conjecture, ν(n) ≤ n^(1 + o(1)),
      recorded so that the two are not confused. This work refutes the stronger
      1994 form, and the weaker one follows.
  - title: Planar Point Sets with Many Unit Distances
    authors: [OpenAI]
    year: 2026
    id: https://cdn.openai.com/pdf/74c24085-19b0-4534-9c90-465b8e29ad73/unit-distance-proof.pdf
    relationship: background
    note: >
      The fixed-power-gain refutation, not used here. Attributing the unbylined
      PDF to OpenAI is an inference.

automation:
  methods:
    - method: agent
      framework: Claude Code (Anthropic)
      models: [claude-fable-5]
      tool_setup: >
        The orchestrating session, and the only one: both this repository and
        the proof library came out of it. Designed every statement, verified
        all 27 intermediate lemmas, generated a project per open goal,
        integrated the provers' results, performed the v4.28 to master ports,
        and proved a number of lemmas directly.
      cost:
        wall_time: >
          2026-06-11 03:19 UTC to 2026-06-12 07:20 UTC. 1,139 API calls, of
          which 1,120 on 06-11 for the formalization itself; the remaining 19
          calls on 06-12 were this repository's landrun fix in verify.sh.
        tokens: >
          1,514,396 output, 231,309 fresh input, 8,752,408 cache write,
          563,366,603 cache read.
    - method: agent
      framework: Aristotle (Harmonic), CLI v2
      tool_setup: >
        Prover, targeting Lean v4.28.0. 31 tasks submitted, 7 cancelled, 22
        lemmas proved, including the key inequality, the grid-pigeonhole
        geometric core, and the Rankin-style ideal count.
      cost:
        tokens: not exposed by the service, so this part of the cost is unmeasured
    - method: agent
      framework: Codex CLI (OpenAI)
      models: [gpt-5.5]
      tool_setup: >
        Prover and auditor. Eight rollouts on 2026-06-11 between 03:50 and
        12:42 UTC. Closed the analytic input, the square-class descent and the
        multiquadratic degree bridge, ported Framework.lean to v4.31.0-rc2,
        and audited the key inequality at the statement level before any prover
        time was spent on it, catching two bugs.
      cost:
        tokens: >
          22,572,759 input of which 21,587,328 cached, so 985,431 fresh;
          96,171 output, including 34,865 reasoning.
  notes: >
    The formalization was completed on 2026-06-11 in a single working day, and
    migrated to Lean v4.31.0-rc2 on 2026-06-17. Per-lemma attribution is in the
    git history of both repositories: each integration commit names the prover.

    The figures above are measured from the session and rollout logs after the
    fact, and supersede those recorded in the proof library's own
    formalization.yaml. Those were written part way through the session, on
    2026-06-11 at 12:11 UTC, so they undercount the directing session, which
    ran for another day; and they overcount Codex, because that measurement
    matched rollouts by text search and swept in unrelated sessions that
    happened to mention the repository in passing.

review:
  status: self-assessed
  reviewers:
    - Kim Morrison
  notes: >
    No independent human review of the mathematics. The submitter, the
    directing session's operator, and the author of this metadata are the same
    person. The Lean proof is machine-checked and sorry-free, and Comparator
    independently certifies that the library proves the Mathlib-only statement
    in Challenge.lean from the three standard axioms; neither of those is a
    check on whether the informal argument is correct or the statement is the
    right formalization of Erdős's conjecture.

fidelity:
  divergences: >
    The pinned dependency kim-em/PrimeNumberTheoremAnd contains sorried
    declarations in Wiener.lean, but they are not in the axiom closure of the
    compared theorem: the exported axiom set is exactly propext, Quot.sound and
    Classical.choice. Challenge.lean contains one `sorry`, standing for the
    proof that Solution.lean supplies; comparator.json declares no
    definition_names, so nothing in the statement is left open for the solution
    to instantiate.
