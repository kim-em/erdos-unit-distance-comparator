# Provenance metadata for the formalization of Alpöge's disproof of the
# uniform-constant Erdős unit-distance conjecture.

version: v0.3

project:
  name: Formalization of the disproof of the uniform-constant Erdős unit-distance conjecture
  authors: [Kim Morrison]
  license: Apache-2.0

classification:
  arxiv: [math.CO]
  msc2020: [52C10]

result:
  name: erdos_unit_distance_uniform_constant_false
  statement: >
    For every C > 0 and every N there exist n ≥ N and an n-point set
    P ⊆ ℝ² whose number of unit-distance pairs exceeds
    n^(1 + C / log log n). This refutes Erdős's 1946 conjectured bound
    ν(n) ≤ n^(1 + C/log log n) for an absolute constant C. The theorem
    quantifies over C > 0; this is harmless because any bound with C ≤ 0
    would imply the corresponding bound for a positive C.
  compared_declaration: UnitDistance.erdos_unit_distance_uniform_constant_false
  axioms: [propext, Classical.choice, Quot.sound]
  sorries: 0
  lean_toolchain: leanprover/lean4:v4.31.0-rc2
  scope_limitations: >
    This is strictly weaker than a fixed-power improvement n^(1+δ).
    It refutes only the uniform-constant form of the conjecture; it does not
    formalize the stronger fixed-power-gain result.

