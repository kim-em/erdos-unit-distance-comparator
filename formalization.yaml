review:
  status: self-assessed

provenance:
  human_review: >
    Kim Morrison read the human-auditable Challenge statement, compared it
    against the informal claim and scope limitations, and inspected every
    returned Lean artifact before integration. No independent specialist or
    journal-style human review of the mathematics is claimed.
  automated_checks: >
    The directing AI sessions checked intermediate statements and artifacts.
    Comparator independently checks the advertised declaration and kernel
    proof, including its axiom closure.
  fidelity_gaps: >
    The Lean development follows the one-page proof's norm-one-torus and
    integral-point construction at a high level, but it is not a line-by-line
    transcription. It replaces informal estimates with explicit effective
    ideal-count, class-number, discriminant, unit-square,
    conjugate-transversal, and multiquadratic square-class lemmas, many supplied
    by the pinned TauCeti dependency. It proves only the uniform-constant
    refutation recorded above, not the stronger fixed-power result. No other
    strengthening or weakening of the headline statement is claimed.
  attribution_note: >
    Per-lemma attribution is recorded in the pinned proof repository's Git
    history. Several general lemmas were subsequently upstreamed to Tau Ceti.
  director:
    tool: Claude Code
    provider: Anthropic
    model: claude-fable-5[1m]
    role: >
      Statement design; decomposition into intermediate lemmas; verification,
      integration, migration, and audit of prover results; several hand proofs.
  provers:
    - tool: Aristotle
      provider: Harmonic
      tasks_submitted: 31
      tasks_cancelled: 7
      lemmas_proved: 22
      highlights: >
        The grid-pigeonhole geometric core, ideal and discriminant bounds,
        arithmetic construction, unramifiedness and transversal counting.
    - tool: Codex CLI
      provider: OpenAI
      model: gpt-5.5
      sessions: 7
      highlights: >
        The analytic prime-count input, square-class descent and
        multiquadratic-degree bridge, plus a statement audit that found two
        bugs in an intermediate inequality before prover time was spent.
